[project]
name = "omnidata"
version = "0.1.0"
description = "OmniData — sales intelligence on HubSpot, delivered on WhatsApp"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "typer>=0.12",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "chromadb>=1.0,<2.0",
  "langfuse>=3.0,<4.0",
  "weasyprint>=62,<63",
  "pydyf<0.11",  # weasyprint 62.x pins pydyf loosely (>=0.10) but pydyf 0.11+ broke Stream.transform's signature
  "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
omnidata = "omnidata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnidata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]  # robust when the venv .pth is ignored (macOS hidden flag)

[tool.ruff]
line-length = 110
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer idiom

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["chromadb.*"]
follow_imports = "skip"  # chromadb ships inline types; skip so mypy doesn't crawl its whole (large) source tree
[[tool.mypy.overrides]]
module = ["omnidata.crm.*", "omnidata.security.*"]
strict = true
[[tool.mypy.overrides]]
module = ["omnidata.bot.*", "omnidata.alerts.*", "omnidata.transcripts.*"]
disable_error_code = ["index"]  # aggregate queries always return one row
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E701", "B006", "B017"]
