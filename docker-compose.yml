# Postgres comes from `supabase start` (or your managed Supabase); this file runs api + worker.
services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    command: omnidata serve api
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"], interval: 30s }
  worker:
    build: .
    env_file: .env
    command: omnidata serve worker
    depends_on: [api]
